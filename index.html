<!DOCTYPE html>
<html lang="ru">
<head>

<meta name="viewport" content="width=device-width,initial-scale=1">
<title>АГУР</title>
<style>
html,body{margin:0;background:#120e0a;color:#ead7b0;font-family:system-ui,sans-serif;height:100%;overflow:hidden}
body{display:flex;align-items:center;justify-content:center}
#wrap{width:min(96vw,900px);position:relative}
canvas{display:block;width:100%;height:auto;background:#17120d;border:1px solid #57432b;box-shadow:0 0 40px #000}
#hud{display:flex;justify-content:space-between;padding:8px 4px;font-size:14px}
#hint{text-align:center;font-size:12px;opacity:.65;margin-top:5px}
</style>
</head>
<body>
<div id="wrap">
<canvas id="gameCanvas" width="800" height="500"></canvas>
<div id="hud">
<span id="score">Счёт: 0</span>
<span id="level">Уровень: 1 / 88</span>
<span id="lives">Жизни: 3</span>
</div>
<div id="hint">Мышь / ← → · Клик — старт · P — пауза</div>
</div>
<script type="module" src="./js/main.js?v=202608202350"></script>

</html>
