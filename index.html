<!DOCTYPE html>
<html lang="ru">
<head>
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="description" content="АГУР — археологический арканоид по мотивам древней Месопотамии. 12 уровней: раскопки, страж и бесконечный режим.">
  <meta name="theme-color" content="#1a1410">
  <meta property="og:title" content="АГУР">
  <meta property="og:description" content="Археологический арканоид по мотивам древней Месопотамии">
  <meta property="og:type" content="website">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
  <title>АГУР</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="css/style.css">
  <style>#hintText,.hint{display:none!important}</style>
</head>
<body>
  <div class="game-wrapper">
    <canvas id="gameCanvas" width="800" height="500"></canvas>
    <div class="hud">
      <div class="hud-item"><span class="hud-label">&#129689; Счёт</span><span class="hud-value" id="scoreDisplay">0</span></div>
      <div class="hud-item"><span class="hud-label">&#128332; Уровень</span><span class="hud-value" id="levelDisplay">1</span></div>
      <div class="hud-item"><span class="hud-label">&#128167; Жизни</span><span class="hud-value" id="livesDisplay">3</span></div>
    </div>
    <div class="hint" id="hintText"></div>
  </div>
  <div class="rotate-overlay">
    <div class="rotate-icon">&#128241;</div>
    <div>Поверни телефон вертикально</div>
  </div>
  <script type="module" src="js/main.js?v=202608210027"></script>
<script id="score-watcher">
setInterval(function(){
  var lv=document.getElementById('levelDisplay');
  var items=document.querySelectorAll('.hud-item');
  var n=lv?parseInt(lv.textContent,10):1;
  for(var i=0;i<items.length;i++){
    if(items[i].textContent.indexOf('Счёт')>-1){ items[i].style.display=(n>12)?'':'none'; }
  }
},300);
</script>
</body>
</html>
